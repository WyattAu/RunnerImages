# Publish images to AWS ECR
name: Publish ECR

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: public.ecr.aws

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        flavour:
          - base-universal
          - ubuntu
          - node
          - pnpm
          - bun
          - python
          - heavy
          - rust
          - rust-full
          - go
          - java
          - dotnet
          - flutter
          - nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull and push to ECR
        run: |
          REPO="${{ env.ECR_REGISTRY }}/wyattau/runner-images"
          GHCR_REPO="${{ env.REGISTRY }}/wyattau/runner-images"

          # Copy from GHCR to ECR
          for TAG in "latest" "$(cat images/${{ matrix.flavour }}/VERSION)"; do
            docker pull "$GHCR_REPO/${{ matrix.flavour }}:$TAG"
            docker tag "$GHCR_REPO/${{ matrix.flavour }}:$TAG" "$REPO/${{ matrix.flavour }}:$TAG"
            docker push "$REPO/${{ matrix.flavour }}:$TAG"
          done

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.ECR_REGISTRY }}/wyattau/runner-images/${{ matrix.flavour }}:latest'
          format: spdx-json
          output-file: 'sbom-ecr-${{ matrix.flavour }}.spdx.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-ecr-${{ matrix.flavour }}
          path: sbom-ecr-${{ matrix.flavour }}.spdx.json
          retention-days: 90
