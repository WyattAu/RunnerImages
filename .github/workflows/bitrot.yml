# Monthly link-rot check (SPEC-CORE SC-9; advisory, report artifact).
name: bitrot
on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 './**/*.md'
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee-report.json
          if-no-files-found: ignore
