# Build and verify runner images on push/PR to main
# Spec reference: S7.1 Build Pipeline

name: Build

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      flavours: ${{ steps.detect.outputs.flavours }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed flavours
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.base_ref }}"
            CHANGED=$(git diff --name-only "origin/${BASE}...HEAD" -- 'images/*' | grep -oP 'images/\K[^/]+' | grep -v '^shared$' | sort -u)
          else
            CHANGED=$(ls images/ | grep -v '^shared$')
          fi
          echo "flavours=$(echo "$CHANGED" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.flavours != '[]'
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJson(needs.detect-changes.outputs.flavours) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh ${{ matrix.flavour }}

      - name: Reproducibility check (double-build)
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/${{ matrix.flavour }}/VERSION")
          IMAGE="$REPO/${{ matrix.flavour }}:$VERSION"
          DIGEST1=$(docker inspect --format '{{.Id}}' "$IMAGE")
          # Remove first build so second build cannot use cache
          docker rmi "$IMAGE" 2>/dev/null || true
          # Rebuild from scratch
          docker build \
            --no-cache \
            --platform linux/amd64 \
            --progress=plain \
            --build-arg IMAGE_VERSION="$VERSION" \
            --build-arg SOURCE_DATE_EPOCH=0 \
            -t "$IMAGE" \
            "images/${{ matrix.flavour }}/"
          DIGEST2=$(docker inspect --format '{{.Id}}' "$IMAGE")
          echo "Build 1 digest: $DIGEST1"
          echo "Build 2 digest: $DIGEST2"
          if [ "$DIGEST1" != "$DIGEST2" ]; then
            echo "WARN: Builds are not bit-for-bit identical (expected -- timestamps or apt metadata may differ)"
            echo "This is informational. If reproducibility is critical, use SOURCE_DATE_EPOCH."
          else
            echo "PASS: Builds are bit-for-bit identical"
          fi

      - name: Verify image
        run: |
          chmod +x scripts/verify.sh
          ./scripts/verify.sh ${{ matrix.flavour }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: ./scripts/build.sh ${{ matrix.flavour }} --push

      - name: Generate SBOM
        if: github.ref == 'refs/heads/main'
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.REGISTRY }}/wyattau/runner-images/${{ matrix.flavour }}:latest'
          format: spdx-json
          output-file: 'sbom-${{ matrix.flavour }}.spdx.json'

      - name: Upload SBOM
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.flavour }}
          path: sbom-${{ matrix.flavour }}.spdx.json
          retention-days: 90

      - name: Install cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless)
        if: github.ref == 'refs/heads/main'
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/${{ matrix.flavour }}/VERSION")
          IMAGE="$REPO/${{ matrix.flavour }}:$VERSION"
          cosign sign --yes "$IMAGE"
          cosign sign --yes "$REPO/${{ matrix.flavour }}:latest"

      - name: Generate versions.lock
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/${{ matrix.flavour }}/VERSION")
          IMAGE="$REPO/${{ matrix.flavour }}:$VERSION"
          docker run --rm "$IMAGE" dpkg-query -W -f '$${Package}=$${Version}\n' | sort \
            > "images/${{ matrix.flavour }}/versions.lock"

      - name: Upload versions.lock
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: versions-${{ matrix.flavour }}
          path: images/${{ matrix.flavour }}/versions.lock
          retention-days: 90
