# Build and verify runner images on push/PR to main
# B1 layered architecture: base-universal built first, all flavours inherit
# Multi-arch: linux/amd64 + linux/arm64
# Spec reference: S7.1 Build Pipeline

name: Build

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      flavours: ${{ steps.detect.outputs.flavours }}
      has_base: ${{ steps.detect.outputs.has_base }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed flavours
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.base_ref }}"
            CHANGED=$(git diff --name-only "origin/${BASE}...HEAD" -- 'images/*' | grep -oP 'images/\K[^/]+' | grep -v '^shared$' | sort -u)
          else
            CHANGED=$(ls images/ | grep -v '^shared$')
          fi
          echo "flavours=$(echo "$CHANGED" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          if echo "$CHANGED" | grep -q '^base-universal$'; then
            echo "has_base=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_base=false" >> "$GITHUB_OUTPUT"
          fi

  # B1: Build base-universal FIRST, then all child flavours depend on it
  build-base:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.flavours != '[]' &&
      (contains(fromJson(needs.detect-changes.outputs.flavours), 'base-universal') ||
       github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base-universal
        run: |
          chmod +x scripts/build.sh
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh base-universal

      - name: Verify base-universal
        run: |
          chmod +x scripts/verify.sh
          PLATFORM="${{ matrix.platform }}" ./scripts/verify.sh base-universal

      - name: Push base-universal (per-arch)
        if: github.ref == 'refs/heads/main'
        run: |
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh base-universal --push

      - name: Generate versions.lock
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/base-universal/VERSION")
          IMAGE="$REPO/base-universal:$VERSION"
          docker run --rm --platform ${{ matrix.platform }} "$IMAGE" dpkg-query -W -f '$${Package}=$${Version}\n' | sort \
            > "images/base-universal/versions.lock"

      - name: Upload versions.lock
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: versions-base-universal-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: images/base-universal/versions.lock
          retention-days: 90

  # Manifest for base-universal (must complete before child builds on main)
  manifest-base:
    needs: build-base
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/base-universal/VERSION")
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"

          for TAG in "$VERSION" "latest" "$MAJOR" "$MINOR"; do
            FULL_TAG="$REPO/base-universal:$TAG"
            echo "Creating manifest for $FULL_TAG"
            docker buildx imagetools create -t "$FULL_TAG" \
              "$REPO/base-universal:${VERSION}-amd64" \
              "$REPO/base-universal:${VERSION}-arm64" \
              || echo "WARN: manifest creation failed (one arch may be missing)"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign multi-arch manifest
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/base-universal/VERSION")
          cosign sign --yes "$REPO/base-universal:$VERSION"
          cosign sign --yes "$REPO/base-universal:latest"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.REGISTRY }}/wyattau/runner-images/base-universal:latest'
          format: spdx-json
          output-file: 'sbom-base-universal.spdx.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-base-universal
          path: sbom-base-universal.spdx.json
          retention-days: 90

  # B1: Build child flavours AFTER base-universal is available
  build:
    needs: [detect-changes, build-base]
    # On main: always wait for base build. On PR: build-base may be skipped, so check if base-universal changed
    if: |
      always() &&
      needs.detect-changes.outputs.flavours != '[]' &&
      !contains(fromJson(needs.detect-changes.outputs.flavours), 'base-universal')
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJson(needs.detect-changes.outputs.flavours) }}
        platform: [linux/amd64, linux/arm64]
        exclude:
          - flavour: flutter
            platform: linux/arm64
          - flavour: nix
            platform: linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # B1: Ensure base-universal is available (pull from GHCR if not built locally)
      - name: Ensure base-universal image available
        run: |
          chmod +x scripts/build.sh
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          BASE_VERSION=$(tr -d '[:space:]' < "images/base-universal/VERSION")
          ARCH="${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}"
          BASE_IMAGE="$REPO/base-universal:${BASE_VERSION}"
          if ! docker image inspect "$BASE_IMAGE" >/dev/null 2>&1; then
            echo "Pulling base-universal from GHCR..."
            docker pull "$REPO/base-universal:${BASE_VERSION}-${ARCH}" || true
            docker tag "$REPO/base-universal:${BASE_VERSION}-${ARCH}" "$BASE_IMAGE" || true
          fi

      - name: Build image
        run: |
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh ${{ matrix.flavour }}

      - name: Reproducibility check (double-build with snapshot mirror)
        if: matrix.platform == 'linux/amd64'
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/${{ matrix.flavour }}/VERSION")
          IMAGE="$REPO/${{ matrix.flavour }}:$VERSION"
          DIGEST1=$(docker inspect --format '{{.Id}}' "$IMAGE")
          SNAP_DATE=$(date -u +%Y%m%d)
          docker rmi "$IMAGE" 2>/dev/null || true
          PLATFORM="${{ matrix.platform }}" SNAPSHOT_DATE="$SNAP_DATE" ./scripts/build.sh ${{ matrix.flavour }}
          DIGEST2=$(docker inspect --format '{{.Id}}' "$IMAGE")
          echo "Build 1 digest: $DIGEST1"
          echo "Build 2 digest: $DIGEST2"
          if [ "$DIGEST1" != "$DIGEST2" ]; then
            echo "WARN: Builds are not bit-for-bit identical (expected with live apt mirrors)"
          else
            echo "PASS: Builds are bit-for-bit identical"
          fi

      - name: Verify image
        run: |
          chmod +x scripts/verify.sh
          PLATFORM="${{ matrix.platform }}" ./scripts/verify.sh ${{ matrix.flavour }}

      - name: Push image (per-arch)
        if: github.ref == 'refs/heads/main'
        run: |
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh ${{ matrix.flavour }} --push

      - name: Generate versions.lock
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/${{ matrix.flavour }}/VERSION")
          IMAGE="$REPO/${{ matrix.flavour }}:$VERSION"
          docker run --rm --platform ${{ matrix.platform }} "$IMAGE" dpkg-query -W -f '$${Package}=$${Version}\n' | sort \
            > "images/${{ matrix.flavour }}/versions.lock"

      - name: Upload versions.lock
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: versions-${{ matrix.flavour }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: images/${{ matrix.flavour }}/versions.lock
          retention-days: 90

  # Create multi-arch manifest after all per-arch builds succeed
  manifest:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ fromJson(needs.detect-changes.outputs.flavours) }}
        exclude:
          - flavour: base-universal
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/${{ matrix.flavour }}/VERSION")
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"

          for TAG in "$VERSION" "latest" "$MAJOR" "$MINOR"; do
            FULL_TAG="$REPO/${{ matrix.flavour }}:$TAG"
            echo "Creating manifest for $FULL_TAG"
            docker buildx imagetools create -t "$FULL_TAG" \
              "$REPO/${{ matrix.flavour }}:${VERSION}-amd64" \
              "$REPO/${{ matrix.flavour }}:${VERSION}-arm64" \
              || echo "WARN: manifest creation failed (one arch may be missing)"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign multi-arch manifest
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/${{ matrix.flavour }}/VERSION")
          cosign sign --yes "$REPO/${{ matrix.flavour }}:$VERSION"
          cosign sign --yes "$REPO/${{ matrix.flavour }}:latest"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.REGISTRY }}/wyattau/runner-images/${{ matrix.flavour }}:latest'
          format: spdx-json
          output-file: 'sbom-${{ matrix.flavour }}.spdx.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.flavour }}
          path: sbom-${{ matrix.flavour }}.spdx.json
          retention-days: 90
