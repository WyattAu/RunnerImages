# Build and verify runner images on push/PR to main
# Smart change detection: only builds changed flavours
# Uses build-reusable.yml for actual build logic

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavours:
        description: 'Comma-separated flavours (empty = changed only)'
        required: false
        type: string
      push_images:
        description: 'Push images to registry'
        required: false
        type: boolean
        default: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      flavours: ${{ steps.discover.outputs.flavours }}
      child_flavours: ${{ steps.discover.outputs.child_flavours }}
      has_base: ${{ steps.discover.outputs.has_base }}
      has_children: ${{ steps.discover.outputs.has_children }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover changed images
        id: discover
        run: |
          chmod +x scripts/discover-images.sh
          if [ -n "${{ github.event.inputs.flavours }}" ]; then
            RESULT=$(./scripts/discover-images.sh images "${{ github.event.inputs.flavours }}")
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            RESULT=$(./scripts/discover-images.sh changed "origin/${{ github.base_ref }}")
          else
            RESULT=$(./scripts/discover-images.sh changed)
          fi
          echo "$RESULT"
          FLAVOURS=$(echo "$RESULT" | jq -r '.flavour')
          CHILDREN=$(echo "$RESULT" | jq -r '.child_flavours')
          HAS_BASE=$(echo "$RESULT" | jq -r '.has_base')
          HAS_CHILDREN=$(echo "$RESULT" | jq -r '.has_children')
          echo "flavours=$FLAVOURS" >> "$GITHUB_OUTPUT"
          echo "child_flavours=$CHILDREN" >> "$GITHUB_OUTPUT"
          echo "has_base=$HAS_BASE" >> "$GITHUB_OUTPUT"
          echo "has_children=$HAS_CHILDREN" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### Build Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Base:** ${{ steps.discover.outputs.has_base }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Children:** ${{ steps.discover.outputs.child_flavours }}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: detect
    if: needs.detect.outputs.flavours != '[]'
    uses: ./.github/workflows/build-reusable.yml
    with:
      flavours: ${{ needs.detect.outputs.flavours }}
      push: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.push_images == 'true') }}
      sign: ${{ github.ref == 'refs/heads/main' }}
      sbom: ${{ github.ref == 'refs/heads/main' }}
    secrets: inherit

  # Publish to Docker Hub after successful build
  publish-dockerhub:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        flavour: ${{ fromJson(needs.detect.outputs.child_flavours) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and push to Docker Hub
        run: |
          GHCR_REPO="ghcr.io/wyattau/runner-images"
          DOCKERHUB="wyattau/runnerimages"
          FLAVOUR="${{ matrix.flavour }}"
          VERSION=$(tr -d '[:space:]' < "images/${FLAVOUR}/VERSION")

          for TAG in "latest" "$VERSION"; do
            docker pull "${GHCR_REPO}/${FLAVOUR}:${TAG}"
            docker tag "${GHCR_REPO}/${FLAVOUR}:${TAG}" "${DOCKERHUB}:${FLAVOUR}-${TAG}"
            docker push "${DOCKERHUB}:${FLAVOUR}-${TAG}"
          done
