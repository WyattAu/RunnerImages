# Build and verify runner images on push/PR to main
# Smart change detection: only builds changed flavours
# B1 layered architecture: base-universal built first, all flavours inherit

name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavours:
        description: 'Comma-separated flavours (empty = changed only)'
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      flavours: ${{ steps.detect.outputs.flavours }}
      child_flavours: ${{ steps.detect.outputs.child_flavours }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed flavours
        id: detect
        run: |
          chmod +x scripts/discover-images.sh
          if [ -n "${{ github.event.inputs.flavours }}" ]; then
            RESULT=$(./scripts/discover-images.sh images "${{ github.event.inputs.flavours }}")
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            RESULT=$(./scripts/discover-images.sh changed "origin/${{ github.base_ref }}")
          else
            RESULT=$(./scripts/discover-images.sh changed)
          fi
          echo "$RESULT"
          FLAVOURS=$(echo "$RESULT" | jq -c '.flavour')
          CHILDREN=$(echo "$RESULT" | jq -c '.child_flavours')
          echo "flavours=$FLAVOURS" >> "$GITHUB_OUTPUT"
          echo "child_flavours=$CHILDREN" >> "$GITHUB_OUTPUT"
          echo "Flavours: $FLAVOURS"
          echo "Children: $CHILDREN"

  # B1: Build base-universal FIRST
  build-base:
    needs: detect-changes
    if: contains(fromJson(needs.detect-changes.outputs.flavours), 'base-universal')
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache BuildKit layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildkit-cache
          key: buildkit-base-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: buildkit-base-${{ matrix.platform }}-

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base-universal
        run: |
          chmod +x scripts/build.sh scripts/verify.sh
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh base-universal --cache

      - name: Verify base-universal
        run: |
          PLATFORM="${{ matrix.platform }}" ./scripts/verify.sh base-universal

      - name: Push base-universal (per-arch)
        if: github.ref == 'refs/heads/main'
        run: |
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh base-universal --cache --push

  # Manifest for base-universal
  manifest-base:
    needs: build-base
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push multi-arch manifest
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/base-universal/VERSION")
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"

          for TAG in "$VERSION" "latest" "$MAJOR" "$MINOR"; do
            FULL_TAG="$REPO/base-universal:$TAG"
            echo "Creating manifest for $FULL_TAG"
            ARCHES=""
            docker manifest inspect "$REPO/base-universal:${VERSION}-amd64" >/dev/null 2>&1 && ARCHES="$ARCHES $REPO/base-universal:${VERSION}-amd64"
            docker manifest inspect "$REPO/base-universal:${VERSION}-arm64" >/dev/null 2>&1 && ARCHES="$ARCHES $REPO/base-universal:${VERSION}-arm64"
            if [ -n "$ARCHES" ]; then
              docker buildx imagetools create -t "$FULL_TAG" $ARCHES
            else
              echo "WARN: No arch images found for $FULL_TAG"
            fi
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign multi-arch manifest
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/base-universal/VERSION")
          cosign sign --yes "$REPO/base-universal:$VERSION"
          cosign sign --yes "$REPO/base-universal:latest"

  # Build child flavours
  build:
    needs: [detect-changes, build-base]
    if: always() && needs.detect-changes.outputs.child_flavours != '[]'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        flavour: ${{ fromJson(needs.detect-changes.outputs.child_flavours) }}
        platform: [linux/amd64, linux/arm64]
        exclude:
          - flavour: flutter
            platform: linux/arm64
          - flavour: nix
            platform: linux/arm64
          - flavour: swift
            platform: linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache BuildKit layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildkit-cache
          key: buildkit-${{ matrix.flavour }}-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: buildkit-${{ matrix.flavour }}-${{ matrix.platform }}-

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure base-universal image available
        run: |
          chmod +x scripts/build.sh
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          BASE_VERSION=$(tr -d '[:space:]' < "images/base-universal/VERSION")
          ARCH="${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}"
          BASE_IMAGE="$REPO/base-universal:${BASE_VERSION}"
          if ! docker image inspect "$BASE_IMAGE" >/dev/null 2>&1; then
            echo "Pulling base-universal from GHCR..."
            docker pull "$REPO/base-universal:${BASE_VERSION}-${ARCH}" || true
            docker tag "$REPO/base-universal:${BASE_VERSION}-${ARCH}" "$BASE_IMAGE" || true
          fi

      - name: Build image
        run: |
          chmod +x scripts/verify.sh
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh ${{ matrix.flavour }} --cache

      - name: Verify image
        run: |
          PLATFORM="${{ matrix.platform }}" ./scripts/verify.sh ${{ matrix.flavour }}

      - name: Push image (per-arch)
        if: github.ref == 'refs/heads/main'
        run: |
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh ${{ matrix.flavour }} --cache --push

  # Create multi-arch manifests
  manifest:
    needs: [detect-changes, build]
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        flavour: ${{ fromJson(needs.detect-changes.outputs.child_flavours) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push multi-arch manifest
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/${{ matrix.flavour }}/VERSION")
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"

          for TAG in "$VERSION" "latest" "$MAJOR" "$MINOR"; do
            FULL_TAG="$REPO/${{ matrix.flavour }}:$TAG"
            echo "Creating manifest for $FULL_TAG"
            ARCHES=""
            docker manifest inspect "$REPO/${{ matrix.flavour }}:${VERSION}-amd64" >/dev/null 2>&1 && ARCHES="$ARCHES $REPO/${{ matrix.flavour }}:${VERSION}-amd64"
            docker manifest inspect "$REPO/${{ matrix.flavour }}:${VERSION}-arm64" >/dev/null 2>&1 && ARCHES="$ARCHES $REPO/${{ matrix.flavour }}:${VERSION}-arm64"
            if [ -n "$ARCHES" ]; then
              docker buildx imagetools create -t "$FULL_TAG" $ARCHES
            else
              echo "WARN: No arch images found for $FULL_TAG"
            fi
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign manifest
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/${{ matrix.flavour }}/VERSION")
          cosign sign --yes "$REPO/${{ matrix.flavour }}:$VERSION"
          cosign sign --yes "$REPO/${{ matrix.flavour }}:latest"

      - name: Generate provenance attestation
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/${{ matrix.flavour }}/VERSION")
          IMAGE="$REPO/${{ matrix.flavour }}:$VERSION"
          # Create in-toto provenance attestation
          echo "{\"_type\":\"https://in-toto.io/Statement/v0.1\",\"subject\":[{\"name\":\"${{ matrix.flavour }}\",\"digest\":{\"sha256\":\"$(docker manifest inspect "$IMAGE" 2>/dev/null | jq -r '.manifests[0].digest' || echo 'unknown')\"}}],\"predicateType\":\"https://slsa.dev/provenance/v0.2\",\"predicate\":{\"builder\":{\"id\":\"https://github.com/WyattAu/RunnerImages/.github/workflows/build.yml\"},\"buildType\":\"https://github.com/WyattAu/RunnerImages/build@v2\",\"invocation\":{\"configSource\":{\"uri\":\"https://github.com/WyattAu/RunnerImages\",\"digest\":{\"sha1\":\"${{ github.sha }}\"}},\"parameters\":{\"flavour\":\"${{ matrix.flavour }}\",\"version\":\"$VERSION\",\"platform\":\"linux/amd64,linux/arm64\"}},\"materials\":[{\"uri\":\"ubuntu:24.04\",\"digest\":{\"sha256\":\"786a8b558f7be160c6c8c4a54f9a57274f3b4fb1491cf65146521ae77ff1dc54\"}}]}}" > /tmp/provenance-${{ matrix.flavour }}.json
          cosign attest --yes --predicate /tmp/provenance-${{ matrix.flavour }}.json --type https://slsa.dev/provenance/v0.2 "$IMAGE"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.REGISTRY }}/wyattau/runner-images/${{ matrix.flavour }}:latest'
          format: spdx-json
          output-file: 'sbom-${{ matrix.flavour }}.spdx.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.flavour }}
          path: sbom-${{ matrix.flavour }}.spdx.json
          retention-days: 90

  # Publish to Docker Hub
  publish-dockerhub:
    needs: [detect-changes, manifest]
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        flavour: ${{ fromJson(needs.detect-changes.outputs.child_flavours) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Quay.io
        if: vars.QUAY_REGISTRY != ''
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Pull and push to registries
        run: |
          GHCR_REPO="ghcr.io/wyattau/runner-images"
          DOCKERHUB="wyattau/runnerimages"
          QUAY="${QUAY_REGISTRY:-}"
          FLAVOUR="${{ matrix.flavour }}"
          VERSION=$(tr -d '[:space:]' < "images/${FLAVOUR}/VERSION")

          for TAG in "latest" "$VERSION"; do
            docker pull "${GHCR_REPO}/${FLAVOUR}:${TAG}"

            # Docker Hub
            docker tag "${GHCR_REPO}/${FLAVOUR}:${TAG}" "${DOCKERHUB}:${FLAVOUR}-${TAG}"
            for attempt in 1 2 3; do
              if docker push "${DOCKERHUB}:${FLAVOUR}-${TAG}"; then
                break
              fi
              echo "Docker Hub push attempt $attempt failed, retrying in 10s..."
              sleep 10
            done

            # Quay.io (optional)
            if [ -n "$QUAY" ]; then
              docker tag "${GHCR_REPO}/${FLAVOUR}:${TAG}" "${QUAY}/${FLAVOUR}:${TAG}"
              docker push "${QUAY}/${FLAVOUR}:${TAG}" || echo "WARN: Quay push failed"
            fi
          done
        env:
          QUAY_REGISTRY: ${{ vars.QUAY_REGISTRY }}
