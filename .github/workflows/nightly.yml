# Nightly rebuild and security scan
# Multi-arch: linux/amd64 + linux/arm64
# Spec reference: S7.2 Nightly Pipeline, S5 Security Standard

name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  nightly:
    strategy:
      fail-fast: false
      matrix:
        flavour:
          - base-universal
          - ubuntu
          - node
          - python
          - heavy
          - rust
          - rust-full
          - go
          - java
          - dotnet
          - flutter
          - bun
          - pnpm
          - nix
          - ruby
          - php
          - zig
          - swift
        platform: [linux/amd64, linux/arm64]
        exclude:
          - flavour: flutter
            platform: linux/arm64
          - flavour: nix
            platform: linux/arm64
          - flavour: swift
            platform: linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          chmod +x scripts/build.sh
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh ${{ matrix.flavour }}

      - name: Verify image
        run: |
          chmod +x scripts/verify.sh
          PLATFORM="${{ matrix.platform }}" ./scripts/verify.sh ${{ matrix.flavour }}

      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/wyattau/runner-images/${{ matrix.flavour }}:${{ steps.version.outputs.version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Secret scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/wyattau/runner-images/${{ matrix.flavour }}:${{ steps.version.outputs.version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}'
          scanners: 'secret'
          exit-code: '1'

      - name: Push rebuilt image
        run: PLATFORM="${{ matrix.platform }}" ./scripts/build.sh ${{ matrix.flavour }} --push

      - name: Size regression check
        run: |
          VERSION=$(tr -d '[:space:]' < "images/${{ matrix.flavour }}/VERSION")
          ARCH="${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}"
          IMAGE="${{ env.REGISTRY }}/wyattau/runner-images/${{ matrix.flavour }}:$VERSION-$ARCH"
          CURRENT=$(docker inspect --format '{{.Size}}' "$IMAGE")
          echo "Current size ($ARCH): $CURRENT bytes"
