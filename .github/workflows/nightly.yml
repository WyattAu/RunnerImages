# Nightly rebuild and security scan
# Spec reference: S7.2 Nightly Pipeline, S5 Security Standard

name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  nightly:
    strategy:
      fail-fast: false
      matrix:
        flavour:
          - ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh ${{ matrix.flavour }}

      - name: Verify image
        run: |
          chmod +x scripts/verify.sh
          ./scripts/verify.sh ${{ matrix.flavour }}

      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/wyattau/runner-images/${{ matrix.flavour }}:latest'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Secret scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/wyattau/runner-images/${{ matrix.flavour }}:latest'
          scanners: 'secret'
          exit-code: '1'

      - name: Push rebuilt image
        run: ./scripts/build.sh ${{ matrix.flavour }} --push

      - name: Size regression check
        run: |
          VERSION=$(tr -d '[:space:]' < "images/${{ matrix.flavour }}/VERSION")
          IMAGE="${{ env.REGISTRY }}/wyattau/runner-images/${{ matrix.flavour }}:$VERSION"
          CURRENT=$(docker inspect --format '{{.Size}}' "$IMAGE")
          echo "Current size: $CURRENT bytes"
          # Compare with latest released version if available
          PREV_TAG="${{ env.REGISTRY }}/wyattau/runner-images/${{ matrix.flavour }}:latest"
          if docker manifest inspect "$PREV_TAG" >/dev/null 2>&1; then
            docker pull "$PREV_TAG"
            PREV=$(docker inspect --format '{{.Size}}' "$PREV_TAG")
            echo "Previous size: $PREV bytes"
            # Alert if >10% increase
            if [ "$CURRENT" -gt "$((PREV * 110 / 100))" ]; then
              echo "WARN: Size increased by >10% ($PREV -> $CURRENT)"
            fi
          fi
