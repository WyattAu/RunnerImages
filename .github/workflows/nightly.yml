# Nightly rebuild and security scan
# Rebuilds ALL flavours regardless of changes

name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      flavours: ${{ steps.discover.outputs.flavours }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover all images
        id: discover
        run: |
          chmod +x scripts/discover-images.sh
          RESULT=$(./scripts/discover-images.sh all)
          echo "$RESULT"
          echo "flavours=$(echo "$RESULT" | jq -r '.flavour')" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    uses: ./.github/workflows/_build-reusable.yml
    with:
      flavours: ${{ needs.discover.outputs.flavours }}
      push: true
      sign: true
      sbom: true
    secrets: inherit

  scan:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        flavour: ${{ fromJson(needs.discover.outputs.flavours) }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(tr -d '[:space:]' < images/${{ matrix.flavour }}/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/wyattau/runner-images/${{ matrix.flavour }}:${{ steps.version.outputs.version }}-amd64'
          format: 'sarif'
          output: 'trivy-${{ matrix.flavour }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/wyattau/runner-images/${{ matrix.flavour }}:${{ steps.version.outputs.version }}-amd64'
          format: 'table'
          scanners: 'secret'
