# Nightly rebuild and security scan
# Rebuilds ALL flavours regardless of changes

name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  build-base:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base-universal
        run: |
          chmod +x scripts/build.sh scripts/verify.sh
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh base-universal --no-cache
          PLATFORM="${{ matrix.platform }}" ./scripts/verify.sh base-universal
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh base-universal --no-cache --push

  build:
    needs: build-base
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        flavour:
          - ubuntu
          - node
          - pnpm
          - bun
          - python
          - heavy
          - rust
          - rust-full
          - go
          - java
          - dotnet
          - flutter
          - nix
          - ruby
          - php
          - zig
          - swift
          - deno
          - elixir
          - kotlin
          - c
          - haskell
          - r-lang
        platform: [linux/amd64, linux/arm64]
        exclude:
          - flavour: flutter
            platform: linux/arm64
          - flavour: nix
            platform: linux/arm64
          - flavour: swift
            platform: linux/arm64
          - flavour: haskell
            platform: linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure base-universal available
        run: |
          chmod +x scripts/build.sh
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          BASE_VERSION=$(tr -d '[:space:]' < "images/base-universal/VERSION")
          ARCH="${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}"
          BASE_IMAGE="$REPO/base-universal:${BASE_VERSION}"
          if ! docker image inspect "$BASE_IMAGE" >/dev/null 2>&1; then
            docker pull "$REPO/base-universal:${BASE_VERSION}-${ARCH}" || true
            docker tag "$REPO/base-universal:${BASE_VERSION}-${ARCH}" "$BASE_IMAGE" || true
          fi

      - name: Build, verify, push
        run: |
          chmod +x scripts/verify.sh
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh ${{ matrix.flavour }} --no-cache
          PLATFORM="${{ matrix.platform }}" ./scripts/verify.sh ${{ matrix.flavour }}
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh ${{ matrix.flavour }} --no-cache --push

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/wyattau/runner-images/${{ matrix.flavour }}:latest'
          format: 'sarif'
          output: 'trivy-${{ matrix.flavour }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/wyattau/runner-images/${{ matrix.flavour }}:latest'
          format: 'table'
          scanners: 'secret'
