# Security scan for runner images
name: Security

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        flavour:
          - base-universal
          - ubuntu
          - node
          - pnpm
          - bun
          - python
          - heavy
          - rust
          - rust-full
          - go
          - java
          - dotnet
          - flutter
          - nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/wyattau/runner-images/${{ matrix.flavour }}:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/wyattau/runner-images/${{ matrix.flavour }}:latest'
          scanners: 'secret'
          exit-code: '1'
