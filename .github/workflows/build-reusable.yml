# Reusable build workflow for RunnerImages
# Called by build.yml, nightly.yml, and manual dispatch
# Adapts EvergreenImageRegistry pattern: batched builds, retry, BuildKit recycling

name: _Build Reusable

on:
  workflow_call:
    inputs:
      flavours:
        description: 'JSON array of flavours to build'
        required: true
        type: string
      platforms:
        description: 'JSON array of platforms'
        required: false
        type: string
        default: '["linux/amd64", "linux/arm64"]'
      push_images:
        description: 'Push images to registry'
        required: false
        type: boolean
        default: false
      sign:
        description: 'Sign images with cosign'
        required: false
        type: boolean
        default: false
      sbom:
        description: 'Generate SBOMs'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  # Build base-universal first if it's in the flavours list
  build-base:
    if: contains(fromJson(inputs.flavours), 'base-universal')
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(inputs.platforms) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache BuildKit layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildkit-cache
          key: buildkit-base-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            buildkit-base-${{ matrix.platform }}-

      - name: Log in to GHCR
        if: inputs.push_images
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base-universal
        run: |
          chmod +x scripts/build.sh scripts/verify.sh
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh base-universal

      - name: Verify base-universal
        run: |
          PLATFORM="${{ matrix.platform }}" ./scripts/verify.sh base-universal

      - name: Push base-universal (per-arch)
        if: inputs.push_images
        run: |
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh base-universal --push

  # Build child flavours after base-universal
  build-children:
    needs: build-base
    if: always() && needs.build-base.result != 'failed'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        flavour: ${{ fromJson(inputs.flavours) }}
        platform: ${{ fromJson(inputs.platforms) }}
        exclude:
          - flavour: base-universal
          - flavour: flutter
            platform: linux/arm64
          - flavour: nix
            platform: linux/arm64
          - flavour: swift
            platform: linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache BuildKit layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildkit-cache
          key: buildkit-${{ matrix.flavour }}-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            buildkit-${{ matrix.flavour }}-${{ matrix.platform }}-

      - name: Log in to GHCR
        if: inputs.push_images
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure base-universal available
        run: |
          chmod +x scripts/build.sh
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          BASE_VERSION=$(tr -d '[:space:]' < "images/base-universal/VERSION")
          ARCH="${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}"
          BASE_IMAGE="$REPO/base-universal:${BASE_VERSION}"
          if ! docker image inspect "$BASE_IMAGE" >/dev/null 2>&1; then
            echo "Pulling base-universal from GHCR..."
            docker pull "$REPO/base-universal:${BASE_VERSION}-${ARCH}" || true
            docker tag "$REPO/base-universal:${BASE_VERSION}-${ARCH}" "$BASE_IMAGE" || true
          fi

      - name: Build ${{ matrix.flavour }}
        run: |
          chmod +x scripts/verify.sh
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh ${{ matrix.flavour }}

      - name: Verify ${{ matrix.flavour }}
        run: |
          PLATFORM="${{ matrix.platform }}" ./scripts/verify.sh ${{ matrix.flavour }}

      - name: Push ${{ matrix.flavour }} (per-arch)
        if: inputs.push_images
        run: |
          PLATFORM="${{ matrix.platform }}" ./scripts/build.sh ${{ matrix.flavour }} --push

  # Create multi-arch manifests
  manifest:
    needs: [build-base, build-children]
    if: inputs.push_images && always() && needs.build-children.result != 'failed'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        flavour: ${{ fromJson(inputs.flavours) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/${{ matrix.flavour }}/VERSION")
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"

          for TAG in "$VERSION" "latest" "$MAJOR" "$MINOR"; do
            FULL_TAG="$REPO/${{ matrix.flavour }}:$TAG"
            echo "Creating manifest for $FULL_TAG"
            ARCHES=""
            docker manifest inspect "$REPO/${{ matrix.flavour }}:${VERSION}-amd64" >/dev/null 2>&1 && ARCHES="$ARCHES $REPO/${{ matrix.flavour }}:${VERSION}-amd64"
            docker manifest inspect "$REPO/${{ matrix.flavour }}:${VERSION}-arm64" >/dev/null 2>&1 && ARCHES="$ARCHES $REPO/${{ matrix.flavour }}:${VERSION}-arm64"
            if [ -n "$ARCHES" ]; then
              docker buildx imagetools create -t "$FULL_TAG" $ARCHES
            else
              echo "WARN: No arch images found for $FULL_TAG"
            fi
          done

      - name: Install cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@v3

      - name: Sign manifest
        if: inputs.sign
        run: |
          REPO="${{ env.REGISTRY }}/wyattau/runner-images"
          VERSION=$(tr -d '[:space:]' < "images/${{ matrix.flavour }}/VERSION")
          cosign sign --yes "$REPO/${{ matrix.flavour }}:$VERSION"
          cosign sign --yes "$REPO/${{ matrix.flavour }}:latest"

      - name: Generate SBOM
        if: inputs.sbom
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.REGISTRY }}/wyattau/runner-images/${{ matrix.flavour }}:latest'
          format: spdx-json
          output-file: 'sbom-${{ matrix.flavour }}.spdx.json'

      - name: Upload SBOM
        if: inputs.sbom
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.flavour }}
          path: sbom-${{ matrix.flavour }}.spdx.json
          retention-days: 90
