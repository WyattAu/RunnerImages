# Haskell CI with cabal build and test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wyattau/runner-images/haskell:1
    steps:
      - uses: actions/checkout@v4
      - run: ghc --version
      - run: cabal update
      - run: cabal build
      - run: cabal test
